[pytest]
testpaths = tests nss plugin .
# "." searches the whole repo: skip the virtual environments and claude-cfg (Claude Code plug-ins with their own tests), plus pytest's defaults
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv ai-venv {arch} claude-cfg
pythonpath = .
python_files = *_test.py test_*.py
markers =
    lightroom: validation against the Lightroom w_*.tif exports in tests/test_data (slow, skipped when they are missing)
